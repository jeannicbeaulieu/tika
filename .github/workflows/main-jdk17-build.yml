name: main jdk17 build

on:
  pull_request:
    branches: [ main, tache3 ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main, tache3 ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      rickroll_demo:
        description: 'Faire échouer volontairement un test (RickrollDemoTest) pour démontrer le rickroll'
        type: boolean
        default: false

permissions:
  contents: read

env:
  SEMGREP_VERSION: '1.185.0'
  SEMGREP_RULES_REPO: 'https://github.com/semgrep/semgrep-rules'
  SEMGREP_RULES_SHA: 'a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2'

jobs:
  semgrep:
    name: Semgrep (nouvelles vulnérabilités)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep ${{ env.SEMGREP_VERSION }}
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Fetch pinned Semgrep rules
        run: |
          git init -q "$RUNNER_TEMP/semgrep-rules"
          cd "$RUNNER_TEMP/semgrep-rules"
          git fetch -q --depth 1 "$SEMGREP_RULES_REPO" "$SEMGREP_RULES_SHA"
          git checkout -q FETCH_HEAD
          echo "Règles semgrep-rules @ $(git rev-parse --short HEAD)"

      - name: Determine baseline commit
        id: baseline
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request)
              # Ancêtre commun avec la branche cible : seuls les commits de la PR comptent.
              base=$(git merge-base "$PR_BASE_SHA" HEAD) ;;
            push)
              # Tous les commits poussés d'un coup sont analysés ensemble.
              base="$PUSH_BEFORE" ;;
          esac
          # Premier push d'une branche (before = 000…0), push forcé ou lancement
          # manuel : on compare au parent direct.
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse -q --verify HEAD~1 || true)
          fi
          echo "Commit de base : ${base:-aucun}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Semgrep gate (fail on new findings)
        run: bash .github/scripts/semgrep-gate.sh "$RUNNER_TEMP/semgrep-rules" "${{ steps.baseline.outputs.sha }}" semgrep-out

      - name: Semgrep full report (informative, never blocking)
        if: always()
        continue-on-error: true
        run: |
          mapfile -t dirs < <(find "$RUNNER_TEMP/semgrep-rules/java" -type d -name security | sort)
          args=(); for d in "${dirs[@]}"; do args+=(--config "$d"); done
          semgrep scan "${args[@]}" --metrics=off --disable-version-check \
            --json-output=semgrep-out/complet.json --sarif-output=semgrep-out/complet.sarif -q
          python3 -c "import json;print(len(json.load(open('semgrep-out/complet.json'))['results']), 'résultats au total dans le dépôt')"

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-semgrep
          path: semgrep-out/

  build:
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        if: ${{ !inputs.rickroll_demo }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        if: ${{ !inputs.rickroll_demo }}
        run: >
          mvn clean apache-rat:check test install -B
          -pl tika-core,tika-serialization,tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module,tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-pdf-module,tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module
          -am
          "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll demo (failing test on purpose)
        if: ${{ inputs.rickroll_demo }}
        env:
          RICKROLL_DEMO: 'true'
        run: mvn -B -pl tika-core -am test -Dtest=RickrollDemoTest -Dsurefire.failIfNoSpecifiedTests=false -Drat.skip -Dcheckstyle.skip -Dforbiddenapis.skip "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll if a test failed
        if: failure()
        uses: ./.github/actions/rickroll
        with:
          percentage: '100'

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: ${{ !inputs.rickroll_demo }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll if a test failed
        if: failure()
        uses: ./.github/actions/rickroll